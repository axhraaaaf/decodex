name: Build and Push decodeX

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build TUI and Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Go TUI (Linux)
      run: go build -o decodeX main.go

    - name: Build Go TUI (Windows)
      run: GOOS=windows GOARCH=amd64 go build -o decodeX.exe main.go

    - name: Build Docker Image
      run: docker build -t decodex:latest .

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: decodex-binaries
        path: |
          decodeX
          decodeX.exe
